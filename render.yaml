# Render Blueprint: Commercial Action Centre demo on SYNTHETIC data, Render free tier only.
# Deployment steps: README.md -> "Deploy the demo on Render". Details: docs/DEPLOY_DEMO.md
#
# Create it with  New -> Blueprint  (Render reads this file). Do NOT create a "Static Site": the app
# needs its Python server for the login gate, the API and the database. A static site fails with
# "Empty build command" / "Publish directory ... does not exist", and if it did build it would
# publish the interface without the login gate and without any working API.
#
# There is no build command or publish directory to set: the Dockerfile builds the React app
# (frontend/: npm ci && npm run build -> frontend/dist) and FastAPI serves it behind the login.
#
# One web service (Docker): FastAPI serves the API under /api and the built React app for every
# other route, so the frontend and backend share one URL. One free PostgreSQL database.
#
# No credentials in this file:
#   DEMO_ACCESS_USER / DEMO_ACCESS_PASSWORD  -> "sync: false": Render asks you for the values when you
#                                               create the Blueprint and stores them only in Render.
#   SESSION_SECRET                           -> generated by Render.
#   DATABASE_URL                             -> injected by Render from the database below.
#
# Free-tier limits (see docs/DEPLOY_DEMO.md): the web service sleeps after 15 idle minutes (first visit
# then takes about a minute), and a free database expires 30 days after creation.
services:
  - type: web
    name: jc-pm-action-centre-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: demo            # fails closed: login required, synthetic data only, no AI, no imports
      - key: AUTH_MODE
        value: demo            # demo-user switcher, available only after signing in
      - key: AI_PROVIDER
        value: none
      - key: DEMO_ACCESS_USER
        sync: false            # you enter it in Render (at least 3 characters)
      - key: DEMO_ACCESS_PASSWORD
        sync: false            # you enter it in Render (at least 16 characters)
      - key: SESSION_SECRET
        generateValue: true    # signs login cookies; random value created by Render
      - key: DATABASE_URL
        fromDatabase:
          name: jc-pm-action-centre-demo-db
          property: connectionString

databases:
  - name: jc-pm-action-centre-demo-db
    plan: free
    region: frankfurt
    databaseName: cac_demo
    user: cac_demo
    postgresMajorVersion: "16"
    ipAllowList: []            # no access from the internet; only services in this Render workspace can connect
