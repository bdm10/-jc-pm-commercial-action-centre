# Render Blueprint: password-protected demo of the Commercial Action Centre on SYNTHETIC data only.
# Steps, cost and shutdown: docs/DEPLOY_DEMO.md
#
# No credentials in this file. DEMO_ACCESS_PASSWORD is generated by Render when the Blueprint is
# applied and is stored only in Render (service > Environment). The database URL is injected by Render.
services:
  - type: web
    name: jc-pm-action-centre-demo
    runtime: docker
    plan: starter            # always on (approx. US$7/month). "free" also works but sleeps after 15 idle minutes.
    region: frankfurt
    branch: dev/commercial-action-centre-prototype
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true         # every push to the branch redeploys the demo
    envVars:
      - key: APP_ENV
        value: demo          # requires the access password, synthetic data only, no AI, no imports
      - key: AUTH_MODE
        value: demo          # demo-user switcher, behind the access password
      - key: AI_PROVIDER
        value: none
      - key: DEMO_ACCESS_USER
        value: demo
      - key: DEMO_ACCESS_PASSWORD
        generateValue: true  # random value created by Render; read or change it in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: jc-pm-action-centre-demo-db
          property: connectionString

databases:
  - name: jc-pm-action-centre-demo-db
    plan: basic-256mb        # approx. US$6/month. A "free" database is deleted 30 days after creation (+14-day grace).
    region: frankfurt
    databaseName: cac_demo
    user: cac_demo
    postgresMajorVersion: "16"
    ipAllowList: []          # no access from the internet; only Render services in this account can connect
