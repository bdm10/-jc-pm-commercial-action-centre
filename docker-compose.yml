# Local, demo-only stack (synthetic data). Not a production deployment.
# NOTE: not run in the prototype environment (no Docker daemon available); see README for the tested path.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cac
      POSTGRES_PASSWORD: cac_local_dev
      POSTGRES_DB: cac_dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cac -d cac_dev"]
      interval: 5s
      retries: 10
  api:
    build: .
    environment: &env
      APP_ENV: development
      AUTH_MODE: demo
      DATABASE_URL: postgresql+psycopg://cac:cac_local_dev@db:5432/cac_dev
      AI_PROVIDER: none
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  scheduler:
    build: .
    command: ["python", "-m", "app.cli", "scheduler"]
    environment: *env
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
